services:
  gitea:
    image: gitea/gitea:1
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${DOMAIN}
      GITEA__server__ROOT_URL: http://${DOMAIN}:${HTTP_PORT}/
      GITEA__server__SSH_PORT: "${SSH_PORT}"
    ports:
      - "${HTTP_PORT}:3000"
      - "${SSH_PORT}:22"
    volumes:
      - data:/data

volumes:
  data:
